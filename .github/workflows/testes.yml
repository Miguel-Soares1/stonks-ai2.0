name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    # O app é para Windows; os testes rodam no mesmo sistema
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,e2e]" fastapi uvicorn

      - name: Instalar o navegador dos testes ponta a ponta
        run: python -m playwright install chromium

      # Sem Ollama no CI: os testes da IA usam respostas simuladas
      - name: Rodar os testes
        run: python -m pytest -q -ra --durations=10 --junitxml=junit.xml

      # Cada falha vira uma anotação na página do commit, sem precisar abrir o log
      - name: Anotar falhas
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path
          if not Path("junit.xml").exists():
              print("::error::Os testes não chegaram a gerar o junit.xml")
          else:
              for case in ET.parse("junit.xml").iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      text = (bad.get("message") or "") + "\n" + (bad.text or "")[-1500:]
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
